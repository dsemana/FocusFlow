# Replace focusflow.example.com and certificate paths before installing.
server {
    listen 80;
    server_name focusflow.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name focusflow.example.com;
    ssl_certificate /etc/letsencrypt/live/focusflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/focusflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;

    location /static/ {
        alias /srv/focusflow/app/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # This deployment trusts exactly one reverse proxy. Replace incoming XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
